{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Cook</title>
    
    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="{% static 'pages/script.js' %}" defer></script>
    <style>
    /* ── Palette — warm, earthy, welcoming ──────────── */
        :root {
            --cream:        #FBF3E8;   /* page background */
            --cream-deep:   #F1E3CE;   /* secondary surface */
            --paper:        #FFFDF9;   /* card surface */
            --tan:          #E4D3B4;   /* borders */
            --tan-soft:     #EEE1C9;

            --brown:        #3A2B22;   /* headings / primary text */
            --brown-soft:   #8A7561;   /* secondary text */

            --sage:         #8AA07C;   /* mid accent (success / secondary) */
            --sage-dark:    #52684A;   /* nav / primary actions */
            --sage-pale:    #EEF3E7;

            --terracotta:      #C1662F; /* brand / primary CTA */
            --terracotta-dark: #A24F21;
            --terracotta-pale: #FBE9DB;

            --gold:         #D9A441;   /* ratings, highlights */
            --gold-dark:    #B87F1F;

            --berry:        #B4536C;   /* favourites / hearts */
            --berry-dark:   #964359;

            --rose:         #C1665F;   /* delete / errors */
            --rose-dark:    #9C4C46;
            --rose-pale:    #FBEDEA;

            /* legacy variable names kept so every page keeps working */
            --green:        var(--sage);
            --green-mid:    var(--sage);
            --green-dark:   var(--sage-dark);
            --olive:        var(--sage-dark);
            --amber:        var(--gold-dark);
            --red-soft:     var(--rose);

            --radius-sm:  10px;
            --radius-md:  16px;
            --radius-lg:  22px;
            --shadow-sm:  0 2px 10px rgba(58,43,34,0.07);
            --shadow-md:  0 10px 28px rgba(58,43,34,0.11);
        }

    /* ── Base ────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Figtree', 'Segoe UI', sans-serif;
            background: var(--cream);
            background-image:
                radial-gradient(circle at 8% 0%, rgba(193,102,47,0.07), transparent 40%),
                radial-gradient(circle at 95% 12%, rgba(82,104,74,0.06), transparent 38%);
            background-attachment: fixed;
            color: var(--brown);
            margin: 0;
            min-height: 100vh;
            line-height: 1.6;
        }

        h1, h2, h3 {
            font-family: 'Fraunces', Georgia, serif;
            color: var(--brown);
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        a { color: var(--terracotta-dark); text-decoration: none; }
        a:hover { color: var(--terracotta); }

    /* ── Nav ─────────────────────────────────────────── */
        nav {
            background: var(--paper);
            padding: 0.5rem 2rem;
            border-bottom: 1.5px solid var(--tan);
            position: sticky; top: 0; z-index: 40;
        }

        nav ul {
            list-style: none;
            margin: 0; padding: 0;
            display: flex;
            align-items: center;
            gap: 0.2rem;
            flex-wrap: wrap;
            max-width: 1080px;
            margin: 0 auto;
        }

        nav ul li:first-child a {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--terracotta-dark);
            padding-left: 0.4rem;
            margin-right: 0.6rem;
        }
        nav ul li:first-child a:hover { background: transparent; color: var(--terracotta); }

        nav ul li a {
            display: block;
            padding: 0.7rem 1rem;
            color: var(--brown-soft);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.2px;
            border-radius: 999px;
            transition: background 0.2s, color 0.2s;
        }

        nav ul li a:hover {
            background: var(--sage-pale);
            color: var(--sage-dark);
        }

        nav ul li:last-child, nav ul li:nth-last-child(2) { margin-left: auto; }

        .nav_logout_btn {
            background: none;
            border: 1.5px solid var(--tan);
            color: var(--brown-soft);
            padding: 0.45rem 1rem;
            border-radius: 999px;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .nav_logout_btn:hover { background: var(--rose-pale); color: var(--rose-dark); border-color: var(--rose); }

    /* ── Page wrapper ────────────────────────────────── */
        main { padding: 2rem; max-width: 960px; margin: 0 auto; }

    /* ── Shared card ─────────────────────────────────── */
        .card {
            background: var(--paper);
            border: 1.5px solid var(--tan);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-3px);
            transition: box-shadow 0.25s ease, transform 0.2s ease;
        }

    /* ── Recipe card grid ────────────────────────────── */
        .recipe_cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .card_image_wrap {
            width: 100%; aspect-ratio: 16/9;
            overflow: hidden; max-height: 220px;
            border-radius: var(--radius-md) var(--radius-md) 0 0;
        }
        .card_image_wrap img {
            width: 100%; height: 100%;
            object-fit: cover; object-position: center; display: block;
            transition: transform 0.35s ease;
        }
        .card:hover .card_image_wrap img { transform: scale(1.04); }

    /* ── Search bar ──────────────────────────────────── */
        .search_form { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .search_input {
            flex: 1; min-width: 140px;
            padding: 10px 16px;
            border: 1.5px solid var(--tan);
            border-radius: 999px; font-size: 14px;
            background: var(--paper); outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search_input:focus { border-color: var(--terracotta); box-shadow: 0 0 0 3px rgba(193,102,47,0.14); }

        .search_btn {
            padding: 10px 22px;
            background: var(--terracotta); color: var(--paper);
            border: none; border-radius: 999px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        .search_btn:hover { background: var(--terracotta-dark); transform: translateY(-1px); }

    /* ── Filter link ─────────────────────────────────── */
        .filter_link_wrap { margin-bottom: 20px; }
        .btn_filter_page {
            display: inline-block; padding: 9px 18px;
            border: 1.5px solid var(--tan); border-radius: 999px;
            text-decoration: none; color: var(--brown);
            font-size: 14px; font-weight: 600; background: var(--paper);
            transition: border-color 0.2s, background 0.2s;
        }
        .btn_filter_page:hover { background: var(--sage-pale); border-color: var(--sage); color: var(--sage-dark); }

    /* ── Pagination ──────────────────────────────────── */
        .pagination {
            display: flex; align-items: center; gap: 1rem;
            margin-top: 2rem; font-size: 0.9rem; color: var(--brown);
        }
        .pagination a {
            padding: 0.45rem 1rem;
            border: 1.5px solid var(--tan); border-radius: 999px;
            text-decoration: none; color: var(--terracotta-dark);
            background: var(--paper); font-weight: 600;
            transition: background 0.2s, color 0.2s;
        }
        .pagination a:hover { background: var(--terracotta); color: var(--paper); border-color: var(--terracotta); }

    /* ── Grocery boxes (legacy) ──────────────────────── */
        .grocery-box, .preset-items {
            padding: 15px; width: 600px; height: 500px;
            border: 1.5px solid var(--tan); border-radius: var(--radius-md);
            background: var(--paper);
        }
        .grocery-box h2 { margin-top: 0; text-align: center; }
        .grocery-list { list-style: decimal; padding-left: 20px; }
        .grocery-list li { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
        .grocery-list li button { background: none; border: none; color: var(--rose-dark); cursor: pointer; font-weight: bold; }

    /* ── Generic button ──────────────────────────────── */
        .btn {
            background: var(--paper); border: 1.5px solid var(--tan);
            margin: 5px; border-radius: 999px;
            padding: 14px 24px; font-size: 15px;
            font-weight: 600; color: var(--brown);
            display: inline-flex; align-items: center;
            cursor: pointer; transition: transform 0.2s, border-color 0.2s;
        }
        .btn:hover { transform: translateY(-1px); border-color: var(--terracotta); }
        .icon { width: 20px; height: 20px; margin-right: 8px; }

        ::selection { background: var(--terracotta-pale); color: var(--terracotta-dark); }
    </style>
</head>
<body>
    
    <nav>
        <ul>
            <li><a href="{% url 'home' %}">Campus Cook</a></li>
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'grocery' %}">Grocery</a></li>
            <li><a href="{% url 'recipe_list' %}">Recipes</a></li>
            <li><a href="{% url 'home' %}#popular-recipes">Popular</a></li>
            <li><a href="{% url 'about' %}">About</a></li>
            <li><a href="{% url 'feedback' %}">Feedback</a></li>
            {% if user.is_authenticated %}
                <li><a href="{% url 'profile' %}">Profile</a></li>
                <li>
                    <!-- logout must be POST — using a small form instead of a link -->
                    <form method="POST" action="{% url 'logout' %}" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="nav_logout_btn">Logout</button>
                    </form>
                </li>
            {% else %}
                <li><a href="{% url 'login' %}">Login</a></li>
                <li><a href="{% url 'signup' %}">Sign Up</a></li>
            {% endif %}
        </ul>
    </nav>

    {% block content %}
    <!-- child pages replace this block with their own content -->
    {% endblock %}

    <!-- Select2 JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

</body>
</html>
