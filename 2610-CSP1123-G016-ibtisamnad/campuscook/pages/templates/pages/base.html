{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Cook</title>
    
    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    
    <script src="{% static 'pages/script.js' %}" defer></script>
    <style>
    /* ── Palette ─────────────────────────────────────── */
        :root {
            --cream:      #faf6f0;
            --tan:        #e0d5c1;
            --brown:      #2c2520;
            --green:      #6ac383;
            --green-mid:  #96D4AA;
            --green-dark: #2d6a4f;
            --olive:      #5c6b3a;
            --amber:      #8a5a00;
        }

    /* ── Base ────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Georgia', serif;
            background: var(--cream);
            color: var(--brown);
            margin: 0;
            min-height: 100vh;
        }

        h1, h2, h3 { color: var(--brown); }

        a { color: var(--green-dark); }
        a:hover { color: var(--green); }

    /* ── Nav ─────────────────────────────────────────── */
        nav {
            background: var(--green-dark);
            padding: 0 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        nav ul {
            list-style: none;
            margin: 0; padding: 0;
            display: flex;
            align-items: center;
            gap: 0.2rem;
            flex-wrap: wrap;
        }

        nav ul li a {
            display: block;
            padding: 0.85rem 1rem;
            color: #d4ead9;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
        }

        nav ul li a:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }

        .nav_logout_btn {
            background: none;
            border: 1.5px solid rgba(255,255,255,0.35);
            color: #d4ead9;
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .nav_logout_btn:hover { background: rgba(255,255,255,0.15); color: #fff; }

    /* ── Page wrapper ────────────────────────────────── */
        main { padding: 2rem; max-width: 960px; margin: 0 auto; }

    /* ── Shared card ─────────────────────────────────── */
        .card {
            background: #fff;
            border: 1.5px solid var(--tan);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(44,37,32,0.07);
        }
        .card:hover {
            box-shadow: 0 6px 20px rgba(44,37,32,0.12);
            transform: translateY(-2px);
            transition: box-shadow 0.2s, transform 0.15s;
        }

    /* ── Recipe card grid ────────────────────────────── */
        .recipe_cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .card_image_wrap {
            width: 100%; aspect-ratio: 16/9;
            overflow: hidden; max-height: 220px;
        }
        .card_image_wrap img {
            width: 100%; height: 100%;
            object-fit: cover; object-position: center; display: block;
        }

    /* ── Search bar ──────────────────────────────────── */
        .search_form { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .search_input {
            flex: 1; min-width: 140px;
            padding: 8px 12px;
            border: 1.5px solid var(--tan);
            border-radius: 8px; font-size: 14px;
            background: #fff; outline: none;
        }
        .search_input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(106,195,131,0.15); }

        .search_btn {
            padding: 8px 16px;
            background: var(--green-dark); color: #fff;
            border: none; border-radius: 8px;
            font-size: 14px; cursor: pointer;
        }
        .search_btn:hover { background: var(--green); }

    /* ── Filter link ─────────────────────────────────── */
        .filter_link_wrap { margin-bottom: 20px; }
        .btn_filter_page {
            display: inline-block; padding: 8px 16px;
            border: 1.5px solid var(--tan); border-radius: 8px;
            text-decoration: none; color: var(--brown);
            font-size: 14px; background: #fff;
        }
        .btn_filter_page:hover { background: var(--cream); border-color: var(--green); }

    /* ── Pagination ──────────────────────────────────── */
        .pagination {
            display: flex; align-items: center; gap: 1rem;
            margin-top: 2rem; font-size: 0.9rem; color: var(--brown);
        }
        .pagination a {
            padding: 0.4rem 0.9rem;
            border: 1.5px solid var(--tan); border-radius: 6px;
            text-decoration: none; color: var(--green-dark);
            background: #fff;
        }
        .pagination a:hover { background: var(--green-dark); color: #fff; }

    /* ── Grocery boxes (legacy) ──────────────────────── */
        .grocery-box, .preset-items {
            padding: 15px; width: 600px; height: 500px;
            border: 2px solid var(--tan); border-radius: 10px;
            background: #fff;
        }
        .grocery-box h2 { margin-top: 0; text-align: center; }
        .grocery-list { list-style: decimal; padding-left: 20px; }
        .grocery-list li { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; }
        .grocery-list li button { background: none; border: none; color: #c00; cursor: pointer; font-weight: bold; }

    /* ── Generic button ──────────────────────────────── */
        .btn {
            background: #fff; border: 1.5px solid var(--tan);
            margin: 5px; border-radius: 8px;
            padding: 14px 24px; font-size: 15px;
            font-weight: 600; color: var(--brown);
            display: inline-flex; align-items: center;
            cursor: pointer; transition: transform 0.2s, border-color 0.2s;
        }
        .btn:hover { transform: scale(1.03); border-color: var(--green); }
        .icon { width: 20px; height: 20px; margin-right: 8px; }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'grocery' %}">Grocery</a></li>
            <li><a href="{% url 'about' %}">About</a></li>
            <li><a href="{% url 'recipe_list' %}">Recipes</a></li>
            {% if user.is_authenticated %}
                <li><a href="{% url 'profile' %}">Profile</a></li>
                <li>
                    <!-- logout must be POST — using a small form instead of a link -->
                    <form method="POST" action="{% url 'logout' %}" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="nav_logout_btn">Logout</button>
                    </form>
                </li>
            {% else %}
                <li><a href="{% url 'login' %}">Login</a></li>
                <li><a href="{% url 'signup' %}">Sign Up</a></li>
            {% endif %}
        </ul>
    </nav>

    {% block content %}
    <!-- child pages replace this block with their own content -->
    {% endblock %}

    <!-- Select2 JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

</body>
</html>
