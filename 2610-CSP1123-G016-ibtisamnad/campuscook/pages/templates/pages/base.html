{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Cook</title>
    
    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    
    <script src="{% static 'pages/script.js' %}" defer></script>
    <link rel="stylesheet" href="{% static 'pages/style.css' %}">
    <style>
        body {
            margin: 0;
            background: #f8f3ed;
            color: #171717;
            font-family: Arial, Helvetica, sans-serif;
        }

        nav {
            background: #2f6f53;
            box-shadow: 0 4px 14px rgba(31, 55, 42, 0.14);
        }

        nav ul {
            display: flex;
            align-items: center;
            gap: 2.4rem;
            margin: 0;
            padding: 0.85rem 4.2rem;
            list-style: none;
        }

        nav a,
        .nav_logout_btn {
            color: #f3ead9;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.2;
            text-decoration: none;
        }

        nav a:hover,
        .nav_logout_btn:hover {
            color: #ffffff;
        }

        .nav_logout_btn {
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        @media (max-width: 760px) {
            nav ul {
                flex-wrap: wrap;
                gap: 1rem 1.4rem;
                padding: 0.9rem 1.3rem;
            }

            nav a,
            .nav_logout_btn {
                font-size: 1.05rem;
            }
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'grocery' %}">Grocery</a></li>
            <li><a href="{% url 'about' %}">About</a></li>
            <li><a href="{% url 'recipe_list' %}">Recipes</a></li>
            <li><a href="{% url 'popular' %}">Popular</a></li>
            {% if user.is_authenticated %}
                <li><a href="{% url 'profile' %}">Profile</a></li>
                <li>
                    <!-- logout must be POST — using a small form instead of a link -->
                    <form method="POST" action="{% url 'logout' %}" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="nav_logout_btn">Logout</button>
                    </form>
                </li>
            {% else %}
                <li><a href="{% url 'login' %}">Login</a></li>
                <li><a href="{% url 'signup' %}">Sign Up</a></li>
            {% endif %}
        </ul>
    </nav>

    {% block content %}
    <!-- child pages replace this block with their own content -->
    {% endblock %}

    <!-- Select2 JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

</body>
</html>
