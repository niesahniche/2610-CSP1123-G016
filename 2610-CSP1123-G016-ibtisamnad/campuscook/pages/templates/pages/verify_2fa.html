{% extends 'pages/base.html' %}

{% block content %}
<div class="auth-container" style="max-width: 450px; margin: 40px auto; padding: 20px;">
    <div class="auth-card" style="background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center;">
        <h2 style="color: #004d40; margin-bottom: 5px;">Verify Your Identity</h2>
        <p class="auth-subtitle" style="color: #666; margin-bottom: 25px;">We sent a 6-digit verification code to <br><strong style="color: #333;">{{ masked_email }}</strong></p>

        <form method="POST" action="{% url 'verify_2fa' %}">
            {% csrf_token %}

            {% if messages %}
                <div class="auth-error-banner" style="background-color: #fce8e6; color: #a51d24; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 0.9em; text-align: left;">
                    {% for message in messages %}
                        <p style="margin: 0;">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <div class="auth-form-group" style="margin-bottom: 25px;">
                <label for="id_code" style="display: block; font-weight: 600; font-size: 0.85em; margin-bottom: 10px; color: #004d40; letter-spacing: 0.5px;">ENTER 6-DIGIT CODE</label>
                <input
                    type="text"
                    id="id_code"
                    name="code"
                    maxlength="6"
                    pattern="\d{6}"
                    required
                    placeholder="000000"
                    autocomplete="one-time-code"
                    inputmode="numeric"
                    style="width: 100%; padding: 12px; font-size: 1.6rem; text-align: center; letter-spacing: 6px; border: 1.5px solid #e0e0e0; border-radius: 8px; box-sizing: border-box; background-color: #fafafa; font-weight: bold; outline: none;"
                    autofocus
                />
            </div>

            <button type="submit" class="auth-btn-submit" style="width: 100%; padding: 12px; background-color: #6ac383; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s;">Verify & Complete Registration</button>
        </form>

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid #eee;">

        <p style="font-size: 0.9em; color: #666;">
            Didn't receive a code? 
            <a href="{% url 'resend_2fa' %}" style="color: #004d40; font-weight: bold; text-decoration: none;">Resend Code</a>
        </p>
    </div>
</div>

<style>
  /* Retained layout designs matching the authentication application look */
  .auth-card {
    background: #fff;
    border: 1.5px solid var(--tan);
    border-radius: 16px;
    padding: 2.5rem 2.25rem;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 10px 32px rgba(44, 37, 32, 0.10);
    margin: 3rem auto;
    animation: auth-fade-in 0.35s ease;
  }
  @keyframes auth-fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .auth-card-header { text-align: center; margin-bottom: 1.75rem; }
  .auth-card-header h1 { font-size: 1.7rem; font-weight: 700; color: var(--brown); margin: 0; }
  .auth-card-header p  { color: #8a8070; margin-top: 0.5rem; font-size: 0.92rem; line-height: 1.4; }
  .auth-card-header strong { color: var(--green-dark); }

  .auth-form-group { margin-bottom: 1.25rem; }

  .auth-form-group label {
    display: block; font-size: 0.78rem; font-weight: 700;
    color: var(--green-dark); margin-bottom: 0.4rem;
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .auth-code-input {
    width: 100%; height: 56px; padding: 0 0.8rem;
    border: 1.5px solid var(--tan); border-radius: 10px;
    font-size: 1.6rem; color: var(--brown); background: var(--cream);
    outline: none; text-align: center; letter-spacing: 0.6rem;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .auth-code-input:focus {
    border-color: var(--green); background: #fff;
    box-shadow: 0 0 0 3px rgba(106, 195, 131, 0.18);
  }

  .auth-messages { margin-bottom: 1.25rem; }
  .auth-message {
    padding: 0.7rem 1rem; border-radius: 8px;
    font-size: 0.875rem; margin-bottom: 0.5rem;
  }
  .auth-message.success { background: #eaf6ee; color: var(--green-dark); border: 1px solid #bfe3cc; }
  .auth-message.error   { background: #fdf0ee; color: #9b2226; border: 1px solid #f0b4ae; }

  .auth-btn-submit {
    width: 100%; padding: 0.875rem;
    background: var(--green-dark); color: #fff; border: none;
    border-radius: 8px; font-size: 1rem; font-weight: 600;
    cursor: pointer; margin-top: 0.4rem;
    transition: background 0.2s, transform 0.1s;
  }
  .auth-btn-submit:hover  { background: var(--green); }
  .auth-btn-submit:active { transform: scale(0.98); }

  .auth-footer-link { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #8a8070; }
  .auth-footer-link a { color: var(--green-dark); font-weight: 600; text-decoration: none; }
  .auth-footer-link a:hover { color: var(--green); text-decoration: underline; }
</style>

{% endblock %}
